# M0-3 dev 数据库栈（docker 轨，ADR-0002）；M0-8 扩展 redis/RocketMQ/Nacos（dev 全栈容器化）；
# M0-9 扩展观测段（otel-collector/jaeger/prometheus/grafana + alertmanager 占位）。
# 注意：本仓库当前开发机无容器运行时（Ruling-6），本文件未在本机运行验证（YAML 已做 Node 解析自检，
#       结构断言固化在 scripts/check-compose.test.mjs 与 scripts/check-observability.test.mjs）；
#       实际运行验证留待 GitHub Actions 容器环境与后续 docker 环境全栈演练——【待 docker 环境补全栈演练】。
#       观测链路端到端（core→collector→jaeger/prometheus→grafana 面板）另见
#       【待 docker 环境补端到端演练】（docs/plans/M0-9-观测基座说明.md §6 演练清单）。
# 口径：
#   - 镜像一律锁 tag 禁 latest（ADR-0002 施工约束）；本机无法访问 Docker Hub 复核 tag 存在性，
#     新增件（redis 7.4.2 / apache/rocketmq 5.3.1 / nacos v2.4.3 / prometheus v3.5.0 /
#     otel-collector-contrib 0.130.0 / jaeger 2.6.0 / grafana 12.1.0 / alertmanager v0.28.1）
#     与既有 pgvector 同口径：docker 环境首跑确认
#   - 口令占位 + env 注入：LJR_PG_PASSWORD / LJR_REDIS_PASSWORD / LJR_GRAFANA_PASSWORD（见 .env.example），
#     密钥禁入文件
#   - 与 portable 轨（scripts/db/*.mjs）共用 services/core/flyway.conf 与 127.0.0.1:5435 端口口径；
#     redis 沿用「避开本机常用端口」惯例映射 127.0.0.1:6380；grafana 因 core 默认占用 3000 映射 3300
#   - 全部端口仅绑 127.0.0.1（dev 单机口径；staging 起由部署平台网络策略接管）
name: ljr-dev

services:
  postgres:
    # PG15 + pgvector（portable 轨暂未含 pgvector，M0 无向量操作；E3 施工前补齐，见 task-2 报告）
    # tag 0.8.0-pg15 为锁定版本；本机无法访问 Docker Hub 复核 tag 存在性，T4 CI 首跑确认
    image: pgvector/pgvector:0.8.0-pg15
    environment:
      POSTGRES_USER: postgres
      # dev 占位口令（生产/共享环境必须经 .env 或环境变量注入真值）
      POSTGRES_PASSWORD: ${LJR_PG_PASSWORD:-ljr-dev-only}
      POSTGRES_DB: ljr_dev
    command:
      - postgres
      - -c
      - timezone=Asia/Shanghai
      - -c
      - log_timezone=Asia/Shanghai
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ljr_dev']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  flyway:
    # Flyway 社区版官方镜像，锁 tag（v13.10.0，2026-10-08 发布，与 GitHub release 对齐）
    image: flyway/flyway:13.10.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/ljr_dev
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: ${LJR_PG_PASSWORD:-ljr-dev-only}
    volumes:
      # 与 portable 轨共用同一份配置（services/core/flyway.conf）
      - ../../services/core/flyway.conf:/flyway/conf/flyway.conf:ro
      # locations=filesystem:migrations 相对容器 CWD(/flyway) 解析，见 flyway.conf 注释
      - ../../services/core/migrations:/flyway/migrations:ro
    # CI/演练用法：docker compose run --rm flyway migrate | validate | clean（clean 仅 dev，ADR-0002）
    command: -connectRetries=10 migrate

  redis:
    # redis 7.x（docs/05 M0-8）：官方 library 镜像，锁 7.4.2；dev 开 requirepass（占位口令 env 注入）
    # core 于 M0 尚未消费 redis（M1 通知中心/调度起接入）；此件先行占位环境
    image: redis:7.4.2
    command:
      - redis-server
      - --requirepass
      - ${LJR_REDIS_PASSWORD:-ljr-dev-only}
    environment:
      # 供 healthcheck 内 redis-cli 使用（$$ 转义 compose 插值）
      LJR_REDIS_PASSWORD: ${LJR_REDIS_PASSWORD:-ljr-dev-only}
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      # 未认证 ping 也会退出 0（输出 NOAUTH）——必须校验输出为 PONG
      test:
        ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$LJR_REDIS_PASSWORD" ping | grep -q PONG']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  rocketmq-namesrv:
    # RocketMQ NameServer（M0-8）。选型=官方 apache/rocketmq 镜像 + 双容器（nameserver+broker）方案：
    #   - apache/* 是 RocketMQ 官方发布镜像（apache/rocketmq-docker 上游），非个人搬运
    #   - 双容器贴近生产拓扑（NameServer 无状态可扩、broker 独立扩缩），单容器魔改镜像偏离部署形态
    # healthcheck 语义=nameserver RPC 可达（clusterList 无 broker 时输出空表、退出码 0；
    # 具体存活表现待 docker 环境演练复核，见文件头【待 docker 环境补全栈演练】）
    image: apache/rocketmq:5.3.1
    command: ['sh', 'mqnamesrv']
    environment:
      # dev 降内存：runserver.sh 默认 4g 堆对开发机过重；JAVA_OPT_EXT 追加在默认参之后
      JAVA_OPT_EXT: '-Xms256m -Xmx256m'
    ports:
      - '127.0.0.1:9876:9876'
    healthcheck:
      test: ['CMD-SHELL', 'sh mqadmin clusterList -n 127.0.0.1:9876 > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  rocketmq-broker:
    # RocketMQ Broker（M0-8）：依赖 NameServer healthy 后启动，注册后方可被 clusterList 检出
    image: apache/rocketmq:5.3.1
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    command:
      - sh
      - mqbroker
      - -n
      - rocketmq-namesrv:9876
      - -c
      - /home/rocketmq/conf/ljr-broker.conf
    environment:
      # dev 降内存：runbroker.sh 默认 8g 堆对开发机过重
      JAVA_OPT_EXT: '-Xms512m -Xmx512m -Xmn128m'
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/ljr-broker.conf:ro
    ports:
      - '127.0.0.1:10909:10909'
      - '127.0.0.1:10911:10911'
    healthcheck:
      # broker 完成注册才算健康（broker-a 为 broker.conf 内 brokerName）
      test: ['CMD-SHELL', 'sh mqadmin clusterList -n rocketmq-namesrv:9876 | grep -q broker-a']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  nacos:
    # Nacos standalone（M0-8）：官方 nacos/nacos-server，embedded derby（dev 免外部存储）。
    # dev 关鉴权（仅 127.0.0.1 暴露）；staging 起 NACOS_AUTH_ENABLE=true + 平台 secrets 注入
    # （NACOS_AUTH_ADMIN_TOKEN 等禁入文件，见 config/README.md）。
    # 9848=8848+1000 的 gRPC 端口：2.x 客户端连接必备，须与主端口一并映射。
    # core 的 ConfigProvider 接 Nacos 实现自 staging 起（dev 不接 nacos-sdk，接口已留位）。
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: 'false'
      TZ: Asia/Shanghai
    ports:
      - '127.0.0.1:8848:8848'
      - '127.0.0.1:9848:9848'
    healthcheck:
      # 2.x readiness 端点（容器自带 curl；待 docker 环境演练复核）
      test:
        ['CMD-SHELL', 'curl -fs http://127.0.0.1:8848/nacos/v1/console/health/readiness || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # ── 观测段（M0-9，docs/plans/M0-9-观测基座说明.md）─────────────────────────────
  # 链路：core(宿主进程) --OTLP http 4318--> otel-collector --otlp/grpc--> jaeger(16686 可查)
  #                                            └─ prometheus exporter 8889 <── prometheus 抓取
  #                                            → grafana(3300，预配 prometheus+jaeger 数据源+占位面板)
  # core 侧只外发 OTLP（OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318，进程 env 注入），
  # 不开 /metrics 端口——pull 交给 collector 的 prometheus exporter，指标与 trace 同一条出口。
  # 本段 Ruling-6 降级：未在本机运行，结构断言固化在 scripts/check-observability.test.mjs。

  otel-collector:
    # contrib 发行版（含 prometheus exporter；核心版无）。config 见 ./otel-collector/config.yaml
    image: otel/opentelemetry-collector-contrib:0.130.0
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '127.0.0.1:4317:4317' # OTLP gRPC（留给需要 grpc 的服务；core 走 http）
      - '127.0.0.1:4318:4318' # OTLP http/protobuf ← core 的 OTEL_EXPORTER_OTLP_ENDPOINT
      # 8889（prometheus exporter）不暴露宿主机：仅 compose 网内被 prometheus 抓取
    healthcheck:
      # health_check 扩展监听 13133（容器自带 wget；待 docker 环境演练复核，口径同文件头）
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:13133/ || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  jaeger:
    # Jaeger v2 all-in-one：OTLP-native（容器网内 4317/4318 直收 collector 转发），内存存储
    #（dev 免外部依赖；staging 起换 ES/Cassandra 后端）。dev 无鉴权——仅 127.0.0.1 暴露
    image: jaegertracing/all-in-one:2.6.0
    ports:
      - '127.0.0.1:16686:16686' # UI/查询 API（trace 检索入口）
    healthcheck:
      # 查询端口可答即存活（待 docker 环境演练复核：v2 镜像内建 wget 与端点形态）
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:16686/ || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  prometheus:
    # 抓取面=collector 的 8889（OTLP 指标转 pull 口径）+ 自监控；告警规则占位见
    # ./prometheus/rules/ljr-alerts.yml；alertmanager 联动配置见 ./prometheus/prometheus.yml
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules/ljr-alerts.yml:/etc/prometheus/rules/ljr-alerts.yml:ro
    ports:
      - '127.0.0.1:9090:9090'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  grafana:
    # provisioning 预配：datasources（prometheus 默认+jaeger）+ 一块 M0 占位面板
    #（./grafana/provisioning/ 与 ./grafana/dashboards/）；面板查询语句待 docker 首跑校准指标名
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # 占位口令 env 注入（同 PG/Redis 口径；真实值只存 .secrets/）
      GF_SECURITY_ADMIN_PASSWORD: ${LJR_GRAFANA_PASSWORD:-ljr-dev-only}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '127.0.0.1:3300:3000' # core 默认占 3000 → grafana 让位（惯例同 5435/6380）
    healthcheck:
      # 镜像内建 curl（待 docker 环境演练复核）
      test: ['CMD-SHELL', 'curl -fs http://127.0.0.1:3000/api/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  alertmanager:
    # 告警占位（M0-9）：通道=webhook 预留（./alertmanager/alertmanager.yml 的 ljr-webhook 接收器）。
    # 电话级通道仅注释占位——供应商/升级策略 PRD 未定义（docs/04 §8 待澄清点），不擅自发明；
    # M1 通知中心（N1）落位时一并裁决通道形态。
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - '127.0.0.1:9093:9093'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:9093/-/healthy || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  pgdata:
