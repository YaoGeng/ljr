# M0-9 grafana 数据源预配（挂载于 /etc/grafana/provisioning/datasources/）。
# prometheus=默认数据源（指标）；jaeger=trace 检索（Explore 面板联动）。
# dev 无鉴权口径：两数据源均为 compose 网内服务名寻址（prometheus:9090 / jaeger:16686）。
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
