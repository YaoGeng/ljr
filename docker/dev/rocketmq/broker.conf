# docker/dev/rocketmq/broker.conf —— dev 单机 broker 配置（M0-8）
# 挂载为容器内 /home/rocketmq/conf/ljr-broker.conf（compose rocketmq-broker 服务 -c 指定）。
# 注意：brokerIP1=127.0.0.1 使 broker 向 NameServer 注册宿主机回环地址——宿主机侧客户端
# 可直连 127.0.0.1:10911；容器网络内客户端（compose 其他服务）应改用服务名地址。
# M0 内无任何 MQ 消费者（outbox relay 为进程内投递），取舍为宿主机侧联调优先。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
autoCreateTopicEnable = true
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
brokerIP1 = 127.0.0.1
listenPort = 10911
