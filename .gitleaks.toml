# gitleaks 配置（M0-5，呼应 M0-7 密钥治理）：默认规则集 + 本仓已申报豁免项。
# 密钥红线（架构 §1.3）：密钥禁入代码与 workflow；本文件只豁免「非密钥的占位/示例值」。
# CI：.github/workflows/ci.yml gitleaks job（镜像锁 tag 运行，detect 全历史扫描）。
#
# ⚠ 语法（M0-7 修复环修正）：全局豁免必须用单表 [allowlist]（gitleaks v8.24 README「Global
# Allowlists」节）——顶层 [[allowlists]] 仅在 rules 内合法，v8.24.3 对顶层的该写法静默忽略
# （本仓曾因此整段豁免失效，经种子密钥双向演练发现，见 docs/plans/M0-隔离演练记录.md §2.3）。
# 多条目之间默认 OR：命中 paths 或 regexes 任一即豁免。

# 继承 gitleaks 官方默认规则集（v8.19+ 语法；默认规则的 rule 级豁免随 extend 生效不受影响）
[extend]
useDefault = true

[allowlist]
description = "① dev 占位口令 ljr-dev-only（docker/dev compose 兜底、docker/dev/.env.example 示例与 docs 文档性提及等已申报的非密钥占位符；源码/测试已清理，真凭据由 scripts/db/start.mjs 生成进 .secrets/dev.env——gitignored）；② 示例环境文件仅两条精确路径：根 .env.example（M0-7 凭据注入约定样张）与 docker/dev/.env.example（dev 口令）——不做任意深度匹配，嵌套 .env.example 不豁免（含真密钥即被默认规则捕获）；③ 测试夹具虚构值 secret-xyz-9876（payment 进件 spec 的 mock license_key 兼日志脱敏断言金丝雀，generic-api-key 按 key+赋值模式误报；a741a7f 入库，全历史扫描须按字面值豁免而非 .gitleaksignore 行号指纹——行号已随文件演进 398→440 漂移）。真实 .env/.secrets/ 已 gitignore、永不入库"
regexes = [
  '''ljr-dev-only''',
  '''secret-xyz-9876''',
]
paths = [
  '''^\.env\.example$''',
  '''^docker/dev/\.env\.example$''',
]
