<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>u06 · 实名认证 — 律聚人原型</title>
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<div class="desk">
  <div class="desk-label">律聚人 · <b>用户端 u06</b> · 实名认证</div>
  <div class="phone">
    <div class="screen">

      <div class="statusbar">
        <span>10:40</span>
        <span class="sic">
          <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="24" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23 4v4c1.2-.3 2-1 2-2s-.8-1.7-2-2z" fill="currentColor" opacity=".4"/></svg>
        </span>
      </div>
      <div class="navbar">
        <a class="back" href="u03-session-detail.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>
        <span class="ttl">实名认证</span>
      </div>

      <!-- 说明 -->
      <section class="sec" style="margin-top:4px">
        <div class="note">
          <span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10v-5z"/><path d="M9 11.5l2 2 4-4"/></svg></span>
          <div>支付前需完成实名认证。实名信息仅用于<b>合规核验与纠纷处理</b>，加密存储，不对外展示。</div>
        </div>
      </section>

      <!-- 表单 -->
      <section class="sec">
        <div class="card">
          <div class="field">
            <label class="lb">姓名<span class="req">*</span></label>
            <input class="input" value="周女士" placeholder="请输入真实姓名">
            <div class="hint">须与身份证一致，用于仲裁材料与纠纷核验</div>
          </div>
          <div class="field" style="margin-bottom:4px">
            <label class="lb">身份证号<span class="req">*</span></label>
            <input class="input" value="1101**********0021" placeholder="请输入 18 位身份证号">
            <div class="hint">脱敏展示，平台不留存明文证件影像</div>
          </div>
        </div>
      </section>

      <!-- 提交 -->
      <section class="sec">
        <a class="btn btn-p btn-lg btn-block" href="u07-payment.html">完成认证，去支付</a>
        <div class="t12 c3 tc mt10">认证即代表你确认《实名信息处理规则》</div>
      </section>

    </div>
  </div>
</div>
</body>
</html>
