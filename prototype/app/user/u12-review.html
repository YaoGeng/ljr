<body class="role-user">
<div class="desk">

    <div class="statusbar"><span class="num">21:38</span><div class="notch"></div><span>5G&nbsp;▮▮▮</span></div>

      </div>

            </span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);">
            <span style="font-size:13.5px;">响应速度</span>
            <span style="display:flex;gap:3px;">
              <svg width="20" height="20" viewBox="0 0 24 24" style="fill:var(--gold-600);"><path d="M12 3.3l2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.8-5.4 2.8 1-6L3.3 9.7l6-.9z"/></svg>

              <svg width="20" height="20" viewBox="0 0 24 24" style="fill:var(--gold-600);"><path d="M12 3.3l2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.8-5.4 2.8 1-6L3.3 9.7l6-.9z"/></svg>
              <svg width="20" height="20" viewBox="0 0 24 24" style="fill:none;stroke:#C9D6E6;stroke-width:1.5;"><path d="M12 3.3l2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.8-5.4 2.8 1-6L3.3 9.7l6-.9z"/></svg>
            </span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);">
            <span style="font-size:13.5px;">服务态度</span>
            <span style="display:flex;gap:3px;">
              <svg width="20" height="20" viewBox="0 0 24 24" style="fill:var(--gold-600);"><path d="M12 3.3l2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.8-5.4 2.8 1-6L3.3 9.7l6-.9z"/></svg>
              <svg width="20" height="20" viewBox="0 0 24 24" style="fill:var(--gold-600);"><path d="M12 3.3l2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.8-5.4 2.8 1-6L3.3 9.7l6-.9z"/></svg>

            </span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 2px;">
            <span style="font-size:13.5px;">整体满意度</span>
            <span style="display:flex;gap:3px;">
              <svg width="20" height="20" viewBox="0 0 24 24" style="fill:var(--gold-600);"><path d="M12 3.3l2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.8-5.4 2.8 1-6L3.3 9.7l6-.9z"/></svg>

        </div>
      </div>

      <div class="sec">
        <div class="sec-head"><h3>文字评价</h3><span class="more">10 字以上</span></div>
        <div class="card">
          <textarea class="input" rows="4" placeholder="说说律师的解答是否解决了你的问题（10 字以上）"></textarea>
        </div>
      </div>

      <div class="card row-between">
        <div>
          <b style="font-size:13.5px;">匿名评价</b>
          <div class="small">开启后，律师与其他用户看到的将是匿名评价</div>
        </div>
        <label class="switch"><input type="checkbox" checked><i></i></label>
      </div>

      <div class="notice mt12">
        <svg class="ic ic-sm" viewBox="0 0 24 24" style="margin-top:2px;"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 7.6v.5"/></svg>
        <div>评价将影响律师信用分与场次排序；提交后 24 小时内可修改一次。</div>
      </div>
    </div>

    <div style="flex:none;padding:10px 14px;background:var(--paper);border-top:1px solid var(--line);">
      <a class="btn btn-seal btn-lg btn-block" href="u11-join.html">提交评价</a>
      <div class="small tac" style="margin-top:6px;">完成评价可获得 20 积分（100 积分 = 1 元）</div>
    </div>

    <div class="tabbar">
      <a href="u02-home.html">
