<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>u01 · 登录注册 — 律聚人原型</title>
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<div class="desk">
  <div class="desk-label">律聚人 · <b>用户端 u01</b> · 登录注册</div>
  <div class="phone">
    <div class="screen" style="padding-bottom:40px">

      <!-- 品牌区 -->
      <div class="hero">
        <div class="statusbar" style="color:#fff">
          <span>9:41</span>
          <span class="sic">
            <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="24" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23 4v4c1.2-.3 2-1 2-2s-.8-1.7-2-2z" fill="currentColor" opacity=".4"/></svg>
          </span>
        </div>
        <div class="in tc" style="padding-top:30px">
          <div style="width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:32px;font-weight:700;color:#fff;margin:0 auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)">律</div>
          <div class="hi" style="font-size:30px;letter-spacing:8px;margin-top:14px">律聚人</div>
          <div class="sub" style="margin-top:8px;letter-spacing:2px">拼单咨询，让律师不再贵</div>
          <div class="flex gap6 mt16" style="justify-content:center">
            <span class="tag" style="background:rgba(255,255,255,.13);color:#E4F2EB;border-color:rgba(255,255,255,.22)">律师开团 B2C</span>
            <span class="tag" style="background:rgba(255,255,255,.13);color:#E4F2EB;border-color:rgba(255,255,255,.22)">用户拼团 C2B</span>
            <span class="tag" style="background:rgba(255,255,255,.13);color:#E4F2EB;border-color:rgba(255,255,255,.22)">Agent 辅助</span>
          </div>
        </div>
      </div>

      <!-- 登录表单 -->
      <section class="sec">
        <div class="card">
          <div class="field">
            <label class="lb">手机号</label>
            <input class="input" type="tel" placeholder="请输入手机号">
          </div>
          <div class="field">
            <label class="lb">短信验证码</label>
            <div class="flex gap8">
              <input class="input grow" placeholder="6 位验证码">
              <button class="btn btn-g btn-sm" style="height:44px;flex:none">获取验证码</button>
            </div>
          </div>
          <label class="flex gap8 mb10" style="cursor:pointer">
            <span style="width:18px;height:18px;border-radius:6px;background:linear-gradient(160deg,var(--ink-400),var(--ink-600));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none">✓</span>
            <span class="t12 c2">我已年满 18 周岁</span>
          </label>
          <label class="flex gap8 mb14" style="cursor:pointer">
            <span style="width:18px;height:18px;border-radius:6px;background:linear-gradient(160deg,var(--ink-400),var(--ink-600));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none">✓</span>
            <span class="t12 c2">已阅读并同意<b class="ci">《用户服务协议》</b>与<b class="ci">《隐私政策》</b></span>
          </label>
          <a class="btn btn-p btn-lg btn-block" href="u02-home.html">登录 / 注册</a>
          <div class="t12 c3 tc mt10">未注册手机号验证后自动注册 · 注册即可浏览，支付前需实名</div>
        </div>
      </section>

      <!-- 律师入驻 -->
      <section class="sec">
        <a class="card flex gap12" href="../lawyer/l01-onboard.html">
          <span class="row" style="padding:0;border:none"><span class="ic">⚖️</span></span>
          <span class="grow">
            <b class="t15">我是律师，去入驻</b>
            <span class="t12 c3" style="display:block;margin-top:2px">执业认证 · 人工审核 3 个工作日 · 律师工作台</span>
          </span>
          <span class="arrow c3">›</span>
        </a>
      </section>

    </div>
  </div>
</div>

</html>
