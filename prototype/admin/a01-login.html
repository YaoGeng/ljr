<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a01 · 登录 — 律聚人运营后台原型</title>
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>

<div class="login-wrap">
  <div class="panel login-card" style="padding:32px 32px 24px">

    <!-- 品牌 -->
    <div class="flex gap12 mb16">
      <div style="width:46px;height:46px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:23px;font-weight:700;color:#fff;background:linear-gradient(155deg,var(--seal-500),#A84535);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25),0 6px 14px -4px rgba(193,78,58,.5)">律</div>
      <div>
        <div class="fd b" style="font-size:20px;letter-spacing:3px">律聚人运营后台</div>
        <div class="t12 c3" style="margin-top:2px;letter-spacing:.5px">AI 增强型法律服务交易平台 · 劳动仲裁首发专项</div>
      </div>
    </div>

    <!-- 表单 -->
    <div class="field">
      <label class="lb">账号</label>
      <input class="input" value="zhaoqian@ljr.example">
    </div>
    <div class="field">
      <label class="lb">密码</label>
      <input class="input" type="password" value="••••••••">
    </div>
    <div class="field">
      <label class="lb">角色</label>
      <select class="select2">
        <option selected>平台运营（赵谦）</option>
        <option>合规专员（孙恪）</option>
        <option>财务（钱荟）</option>
      </select>
      <div class="hint">三角色 RBAC——运营：审核 / 工单 / 撮合；合规：PIA / 审计 / 录音调取（审批+双人复核）；财务：对账 / 分账 / 结算只读视图。</div>
    </div>

    <a class="btn btn-p" href="a02-dashboard.html" style="width:100%;height:42px;font-size:14.5px;letter-spacing:6px">登 录</a>

    <div class="note mt14">操作全程审计留痕 · 生产环境开启双因素认证（2FA）</div>

    <div class="tc t12 c3 mt14">样例数据均为虚构 · 原型 v3.0</div>
  </div>
</div>

</body>
</html>
