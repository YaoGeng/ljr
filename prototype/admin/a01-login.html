<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>律聚人 · 运营后台 · 登录</title>
<link rel="stylesheet" href="assets/admin.css">
</head>
<body class="admin" style="background:linear-gradient(155deg,var(--ink-950) 0%,var(--ink-900) 48%,var(--ink-800) 100%);align-items:center;justify-content:center;">

  <div style="width:400px;max-width:92vw;">
    <div style="background:var(--paper);border-radius:var(--r-lg);padding:34px 34px 24px;box-shadow:0 26px 64px rgba(4,12,22,.45), inset 0 0 0 1px rgba(255,255,255,.04);">
      <!-- 品牌区 -->
      <div style="display:flex;align-items:center;gap:13px;">
        <div style="width:46px;height:46px;border-radius:12px;flex:none;background:var(--seal-600);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:24px;font-weight:700;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22);">律</div>
        <div>
          <div style="font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:3px;color:var(--ink-900);">律聚人 运营后台</div>
          <div style="font-size:11px;color:var(--text-3);letter-spacing:1.5px;margin-top:2px;">Lvjuren · Operations Console</div>
        </div>
      </div>

      <!-- 表单 -->
      <div style="margin-top:26px;">
        <div style="margin-bottom:14px;">
          <div style="font-size:12.5px;color:var(--text-2);margin-bottom:6px;">账号</div>
          <input class="input" style="width:100%;height:38px;" placeholder="手机号 / 运营工号">
        </div>
        <div style="margin-bottom:14px;">
          <div style="font-size:12.5px;color:var(--text-2);margin-bottom:6px;">密码</div>
          <input class="input" type="password" style="width:100%;height:38px;" placeholder="请输入密码">
        </div>
        <div style="margin-bottom:20px;">
          <div style="font-size:12.5px;color:var(--text-2);margin-bottom:6px;">短信验证码</div>
          <div style="display:flex;gap:8px;">
            <input class="input" style="flex:1;height:38px;" placeholder="6 位验证码">
            <button class="btn btn-ghost" style="height:38px;flex:none;" onclick="this.textContent='已发送 60s';this.disabled=true;">获取验证码</button>
          </div>
        </div>
        <a class="btn btn-primary" href="a02-dashboard.html" style="width:100%;height:42px;font-size:14.5px;letter-spacing:6px;">登 录</a>
      </div>

      <!-- 角色说明 -->
      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--text-3);line-height:1.9;">
        三角色 RBAC 权限：<b style="color:var(--text-2);">运营</b>（审核 / 工单 / 撮合）·
        <b style="color:var(--text-2);">合规</b>（可调取录音，需审批 + 双人复核）·
        <b style="color:var(--text-2);">财务</b>（对账 / 退款 / 结算）<br>
        所有只读与审批操作全程审计留痕，登录即视为接受留痕约定。
      </div>
    </div>

    <!-- 定位语 + 备案 -->
    <div style="text-align:center;margin-top:18px;font-size:12.5px;color:var(--ink-300);letter-spacing:2px;">
      AI 增强型法律服务交易平台 · 运营后台
    </div>
    <div style="text-align:center;margin-top:10px;font-size:10.5px;color:#5F7492;">
      京ICP备XXXXXXXX号-X · © 2026 律聚人（备案号占位）
    </div>
  </div>

</body>
</html>
