<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>律聚人 · 全量 UI 原型 v4.0（人民币双色系 · 玻璃拟态）</title>
<style>
/* ============================================================
   律聚人 LJR · 设计体系 v4.0「人民币双色系 · 玻璃拟态 · 简约」
   主色系：一元纸币橄榄绿（90% 面积）
   点缀色：百元纸币豆沙红（≤10%，仅极小面积）
   ============================================================ */
:root{
  --bg:#F4F6F1;            /* 米白绿底 */
  --primary:#3E5C3A;       /* 橄榄绿主色 */
  --primary-2:#6B8E5A;     /* 苔绿 */
  --primary-3:#A8B89B;     /* 浅灰绿 */
  --ink:#2C3E28;           /* 深绿黑文字 */
  --ink-2:#7A8B74;         /* 次级文字 */
  --hi:#C9D6C0;            /* 玻璃高光 */
  --accent:#C25E5E;        /* 百元红点缀 */
  --accent-dk:#B14E4E;
  --accent-soft:#E8C4C4;   /* 淡粉 */
  --glass:rgba(255,255,255,.5);
  --glass-hi:rgba(255,255,255,.72);
  --line:rgba(62,92,58,.12);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit}
::selection{background:rgba(107,142,90,.25)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(122,139,116,.3);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 背景光晕：橄榄绿为主，角落一点红呼应 ---------- */
.orbs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(70px);animation:drift 22s ease-in-out infinite alternate}
.orb.o1{width:620px;height:620px;top:-180px;left:-140px;background:radial-gradient(circle,rgba(107,142,90,.34),transparent 65%)}
.orb.o2{width:520px;height:520px;bottom:-160px;right:-100px;background:radial-gradient(circle,rgba(168,184,155,.42),transparent 65%);animation-delay:-8s}
.orb.o3{width:230px;height:230px;top:6%;right:5%;background:radial-gradient(circle,rgba(194,94,94,.17),transparent 62%);animation-delay:-14s}
.orb.o4{width:300px;height:300px;bottom:16%;left:12%;background:radial-gradient(circle,rgba(107,142,90,.16),transparent 62%);animation-delay:-4s}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(26px,-30px)}}

/* ---------- 顶部栏（端切换） ---------- */
.topbar{position:fixed;top:0;left:0;right:0;height:60px;z-index:60;display:flex;align-items:center;gap:16px;padding:0 22px;background:rgba(255,255,255,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-hi)}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15.5px;letter-spacing:.5px}
.brand .seal{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--primary-2),var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-shadow:0 4px 12px rgba(62,92,58,.3)}
.brand .vv{font-size:10.5px;font-weight:600;color:var(--primary-2);border:1px solid rgba(107,142,90,.4);border-radius:6px;padding:1px 6px;letter-spacing:1px}
.seg{display:flex;background:rgba(62,92,58,.08);border-radius:999px;padding:4px;gap:4px;margin-left:auto}
.seg button{border:0;background:transparent;padding:6px 16px;border-radius:999px;color:var(--ink-2);font-size:13px;cursor:pointer;transition:.18s;display:flex;align-items:center;gap:8px}
.seg button:hover{color:var(--primary)}
.seg button.on{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(62,92,58,.28)}
.top-act{display:flex;gap:8px;align-items:center}

/* ---------- 主容器 ---------- */
.container{max-width:1280px;margin:0 auto;padding:82px 22px 56px}
.hub-wrap{max-width:1080px;margin:0 auto;padding:0 0 4px}

/* ---------- 玻璃卡片 ---------- */
.card{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-hi);border-radius:16px;box-shadow:0 8px 28px rgba(62,92,58,.07)}
.card.acc{background:rgba(194,94,94,.15);border-color:rgba(194,94,94,.38)}
.card.pad{padding:16px 18px}
.card.hov{transition:.2s;cursor:pointer}
.card.hov:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(62,92,58,.13)}
.card.flat{box-shadow:none}

/* ---------- 文本 ---------- */
.h1{font-size:22px;font-weight:700;letter-spacing:.3px}
.h2{font-size:16.5px;font-weight:700}
.h3{font-size:14.5px;font-weight:600}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.big{font-size:24px;font-weight:700}
.money{color:var(--accent-dk);font-weight:700}
.money .rmb{font-size:.72em;margin-right:1px}
.row{display:flex;align-items:center;gap:8px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc{text-align:center}.tr{text-align:right}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.g8{display:flex;gap:8px}.g12{display:flex;gap:12px}.g16{display:flex;gap:16px}
.fcol{display:flex;flex-direction:column}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.divider{height:1px;background:var(--line);margin:14px 0}
.hr-soft{height:1px;background:rgba(62,92,58,.07);margin:12px 0}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:9px 18px;font-size:14px;cursor:pointer;transition:.18s;background:transparent;color:var(--ink);white-space:nowrap;user-select:none}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:scale(.965)}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none;filter:none}
.btn-p{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(194,94,94,.3)}
.btn-p:hover{background:var(--accent-dk)}
.btn-p .money,.btn-p .money .rmb{color:#fff}
.btn-g{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(62,92,58,.26)}
.btn-g:hover{background:#35502F}
.btn-o{border-color:rgba(62,92,58,.3);color:var(--primary);background:rgba(255,255,255,.42)}
.btn-o:hover{border-color:var(--primary-2);background:rgba(255,255,255,.7)}
.btn-ghost{background:rgba(62,92,58,.09);color:var(--primary)}
.btn-ghost:hover{background:rgba(62,92,58,.15)}
.btn-danger-o{border-color:rgba(194,94,94,.4);color:var(--accent-dk);background:rgba(194,94,94,.06)}
.btn-danger-o:hover{background:rgba(194,94,94,.14)}
.btn-sm{padding:5px 13px;font-size:12.5px;border-radius:10px}
.btn-xs{padding:2px 10px;font-size:12px;border-radius:8px;gap:4px}
.btn-lg{padding:13px 22px;font-size:15px;border-radius:14px;width:100%}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.5);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--primary);transition:.15s}
.icon-btn:hover{background:#fff;border-color:var(--primary-3)}

/* ---------- 悬浮发起按钮（FAB · 双端对称主入口） ---------- */
.fab{position:absolute;right:14px;bottom:80px;z-index:30;display:inline-flex;align-items:center;gap:7px;padding:12px 19px;border-radius:999px;background:var(--accent);color:#fff;border:0;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:0 10px 26px rgba(194,94,94,.42);transition:.18s}
.fab:hover{background:var(--accent-dk);transform:translateY(-1px)}
.fab:active{transform:scale(.96)}

/* ---------- 标签 / 徽标 ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:7px;font-size:11.5px;background:rgba(107,142,90,.13);color:#3E5C3A;font-weight:500}
.tag.acc{background:rgba(194,94,94,.13);color:var(--accent-dk)}
.tag.line{background:transparent;border:1px dashed rgba(62,92,58,.35)}
.tag.gray{background:rgba(122,139,116,.14);color:#5E6F58}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2.5px 11px;border-radius:999px;font-size:12px;white-space:nowrap}
.pill-g{background:rgba(107,142,90,.15);color:#3E5C3A}
.pill-r{background:rgba(194,94,94,.15);color:var(--accent-dk)}
.pill-n{background:rgba(122,139,116,.15);color:#5E6F58}
.pill .dt{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.pill.live .dt{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.stamp{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;border:1.5px solid rgba(194,94,94,.8);color:rgba(194,94,94,.9);font-size:12.5px;font-weight:700;letter-spacing:2px;transform:rotate(-12deg);position:relative;flex-shrink:0}
.stamp::after{content:'';position:absolute;inset:4px;border:1px dashed rgba(194,94,94,.5);border-radius:50%}
.stamp.sm{width:44px;height:44px;font-size:10.5px;letter-spacing:1px}

/* ---------- 头像 ---------- */
.avatar{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 3px 10px rgba(62,92,58,.2)}
.avatar.sm{width:28px;height:28px;font-size:11px}
.avatar.lg{width:56px;height:56px;font-size:20px}
.av-g{background:linear-gradient(135deg,#6B8E5A,#3E5C3A)}
.av-g2{background:linear-gradient(135deg,#A8B89B,#6B8E5A)}
.av-r{background:linear-gradient(135deg,#D98A8A,#C25E5E)}
.av-n{background:linear-gradient(135deg,#9FAD98,#7A8B74)}
.online-dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#6B8E5A;border:2px solid #F4F6F1}

/* ---------- 徽章数字 ---------- */
.bdot{min-width:16px;height:16px;border-radius:99px;background:var(--accent);color:#fff;font-size:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}

/* ---------- 芯片（筛选/标签） ---------- */
.chip{padding:5px 14px;border-radius:999px;border:1px solid rgba(62,92,58,.22);background:rgba(255,255,255,.45);font-size:12.5px;color:#4C5F47;cursor:pointer;transition:.15s;white-space:nowrap}
.chip:hover{border-color:var(--primary-2);color:var(--primary)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip.on.acc{background:var(--accent);border-color:var(--accent)}
.chip.dis{opacity:.4;cursor:not-allowed}
.tagchip{padding:3px 11px;border-radius:999px;background:rgba(107,142,90,.1);border:1px solid rgba(107,142,90,.25);font-size:12px;color:#3E5C3A;cursor:pointer;transition:.15s;user-select:none}
.tagchip.on{background:var(--primary);border-color:var(--primary);color:#fff}

/* ---------- 表单 ---------- */
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.label{font-size:12.5px;color:var(--ink-2)}
.label b{color:var(--accent-dk);font-weight:400}
.input,.textarea,.select{width:100%;padding:10px 13px;border-radius:12px;border:1px solid rgba(62,92,58,.2);background:rgba(255,255,255,.62);font:inherit;font-size:13.5px;color:var(--ink);outline:0;transition:.15s}
.textarea{resize:vertical;min-height:76px;line-height:1.6}
.input:focus,.textarea:focus,.select:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(107,142,90,.16);background:#fff}
.input::placeholder,.textarea::placeholder{color:#9FAD98}
.input[disabled]{opacity:.55;background:rgba(122,139,116,.08)}
.field .err{font-size:11.5px;color:var(--accent-dk);display:none}
.field.bad .err{display:block}
.field.bad .input,.field.bad .textarea{border-color:var(--accent);box-shadow:0 0 0 3px rgba(194,94,94,.12)}
.input-idx{position:relative}
.input-idx .code-btn{position:absolute;right:7px;top:50%;transform:translateY(-50%)}
.hint{font-size:11.5px;color:var(--ink-2);line-height:1.55}

/* 开关 */
.sw{width:40px;height:23px;border-radius:999px;background:rgba(122,139,116,.35);position:relative;cursor:pointer;transition:.2s;border:0;flex-shrink:0;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.sw.on{background:var(--primary)}
.sw.on::after{left:20px}
.sw.acc.on{background:var(--accent)}

/* 单选卡片 */
.rc{border:1.5px solid rgba(62,92,58,.18);border-radius:14px;padding:12px 14px;cursor:pointer;background:rgba(255,255,255,.42);transition:.15s;display:block;position:relative}
.rc:hover{border-color:var(--primary-2)}
.rc.on{border-color:var(--primary);background:rgba(107,142,90,.1);box-shadow:0 0 0 3px rgba(107,142,90,.13)}
.rc.acc.on{border-color:var(--accent);background:rgba(194,94,94,.09);box-shadow:0 0 0 3px rgba(194,94,94,.13)}
.rc.dis{opacity:.45;cursor:not-allowed}
.rc .rk{position:absolute;top:10px;right:10px;width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(62,92,58,.3)}
.rc.on .rk{border-color:var(--primary);background:var(--primary);box-shadow:inset 0 0 0 3px #fff}
.rc.acc.on .rk{border-color:var(--accent);background:var(--accent)}

/* 步进器 */
.stepper{display:inline-flex;align-items:center;gap:0;border:1px solid rgba(62,92,58,.22);border-radius:11px;overflow:hidden;background:rgba(255,255,255,.55)}
.stepper button{width:32px;height:32px;border:0;background:transparent;font-size:16px;color:var(--primary);cursor:pointer;transition:.12s}
.stepper button:hover{background:rgba(107,142,90,.12)}
.stepper button[disabled]{opacity:.35;cursor:not-allowed}
.stepper .sv{min-width:44px;text-align:center;font-weight:600;font-size:14px}

/* 滑杆 */
input[type=range].rg{-webkit-appearance:none;width:100%;height:5px;border-radius:99px;background:linear-gradient(90deg,var(--primary-2) var(--fill,50%),rgba(122,139,116,.22) var(--fill,50%));outline:0}
input[type=range].rg::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--primary);box-shadow:0 2px 8px rgba(62,92,58,.3);cursor:pointer}

/* 星级评分 */
.stars{display:inline-flex;gap:4px}
.stars .st{cursor:pointer;color:#C7D2C0;transition:.12s;line-height:0}
.stars .st.on{color:var(--accent)}
.stars .st:hover{transform:scale(1.15)}

/* ---------- 进度条 ---------- */
.prog{height:6px;border-radius:999px;background:rgba(122,139,116,.18);overflow:hidden;flex:1}
.prog i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary-2),var(--primary));transition:width .4s}
.prog.acc i{background:linear-gradient(90deg,#DA9B9B,var(--accent))}

/* ---------- 时间线 ---------- */
.tl{position:relative;padding-left:20px}
.tl::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:rgba(62,92,58,.18)}
.tl .ti{position:relative;padding-bottom:14px}
.tl .ti:last-child{padding-bottom:2px}
.tl .ti::before{content:'';position:absolute;left:-19px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--primary-3);box-shadow:0 0 0 3px rgba(168,184,155,.28)}
.tl .ti.acc::before{background:var(--accent);box-shadow:0 0 0 3px rgba(194,94,94,.22)}

/* ---------- 通知条 / 引用 ---------- */
.notice{display:flex;gap:12px;padding:11px 14px;border-radius:13px;background:rgba(107,142,90,.1);border:1px solid rgba(107,142,90,.22);font-size:12.5px;color:#3E5C3A;line-height:1.6}
.notice.acc{background:rgba(194,94,94,.08);border-color:rgba(194,94,94,.25);color:var(--accent-dk)}
.notice.plain{background:rgba(122,139,116,.1);border-color:rgba(122,139,116,.2);color:#5E6F58}
.quote{border-left:3px solid rgba(107,142,90,.45);padding:6px 0 6px 12px;font-size:12.5px;color:#5E6F58;line-height:1.7}

/* ---------- 表格 ---------- */
.tblwrap{overflow:auto;border-radius:14px}
.table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.table th{font-weight:600;color:var(--ink-2);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
.table td{padding:11px 14px;border-bottom:1px solid rgba(62,92,58,.07);white-space:nowrap}
.table tbody tr{transition:.12s}
.table tbody tr:hover td{background:rgba(62,92,58,.045)}
.table tbody tr:last-child td{border-bottom:0}

/* ---------- 列表行 ---------- */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(62,92,58,.07)}
.lrow:last-child{border-bottom:0}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{padding:16px 18px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:.3px;line-height:1.3}
.kpi.acc .v{color:var(--accent-dk)}
.kpi .delta{font-size:11.5px;font-weight:600}
.kpi .delta.up{color:#3E5C3A}
.kpi .delta.dn{color:var(--accent-dk)}

/* ---------- 图表容器 ---------- */
.chart{display:block;width:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- 桌面 + 手机框 ---------- */
.desk{display:flex;flex-direction:column;align-items:center;gap:16px}
.desk-label{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.phone{width:390px;height:min(844px,calc(100vh - 152px));min-height:620px;border-radius:46px;border:1px solid var(--glass-hi);background:rgba(255,255,255,.34);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 30px 70px rgba(62,92,58,.18),inset 0 1px 0 rgba(255,255,255,.8);position:relative;display:flex;flex-direction:column;overflow:hidden}
.p-status{height:46px;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0;font-size:13px;font-weight:600;color:var(--ink);flex-shrink:0}
.p-status .sticons{display:flex;gap:4px;align-items:center;color:var(--ink)}
.p-screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 14px 18px;scroll-behavior:smooth}
.p-screen::-webkit-scrollbar{width:0}
.p-tabbar{height:66px;flex-shrink:0;display:flex;background:rgba(255,255,255,.62);backdrop-filter:blur(20px);border-top:1px solid var(--glass-hi);padding:6px 8px 10px}
.p-tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-2);font-size:10.5px;cursor:pointer;border-radius:12px;position:relative;transition:.15s}
.p-tabbar button.on{color:var(--primary);font-weight:600}
.p-tabbar button.on::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--accent);position:absolute;bottom:1px}
.p-notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:26px;border-radius:99px;background:rgba(44,62,40,.85);z-index:5}

/* 页内导航条（二级页） */
.navbar{display:flex;align-items:center;gap:12px;padding:6px 0 12px;position:sticky;top:-10px;z-index:9;background:linear-gradient(180deg,rgba(244,246,241,.97) 72%,rgba(244,246,241,0));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.navbar .back{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--primary);flex-shrink:0;transition:.15s}
.navbar .back:hover{background:#fff}
.navbar .nt{font-size:16.5px;font-weight:700;flex:1;text-align:center}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(44,62,40,.34);backdrop-filter:blur(5px);z-index:80;display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s;padding:20px}
.mask.in{opacity:1}
.mask.abs{position:absolute;z-index:40;border-radius:46px;overflow:hidden;padding:0}
.modal{width:min(460px,94vw);max-height:86vh;overflow-y:auto;background:rgba(255,255,255,.85);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid rgba(255,255,255,.85);border-radius:22px;padding:22px;transform:translateY(14px) scale(.97);transition:.24s cubic-bezier(.2,.8,.3,1);box-shadow:0 28px 70px rgba(44,62,40,.24)}
.mask.in .modal{transform:none}
.mask.abs .modal{width:calc(100% - 36px)}
.m-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.m-title{font-size:16px;font-weight:700}
.m-x{width:30px;height:30px;border-radius:50%;border:0;background:rgba(62,92,58,.08);color:var(--ink-2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.m-x:hover{background:rgba(62,92,58,.15);color:var(--ink)}
.m-foot{display:flex;gap:12px;margin-top:18px}
.m-foot .btn{flex:1}
/* 底部动作面板 */
.mask.bottom{align-items:flex-end;padding:0}
.sheet{width:100%;max-height:88vh;overflow-y:auto;background:rgba(255,255,255,.88);backdrop-filter:blur(26px);border:1px solid rgba(255,255,255,.85);border-bottom:0;border-radius:26px 26px 0 0;padding:14px 20px 26px;transform:translateY(30px);transition:.26s cubic-bezier(.2,.8,.3,1)}
.mask.in .sheet{transform:none}
.sheet .grab{width:40px;height:4.5px;border-radius:99px;background:rgba(122,139,116,.3);margin:0 auto 14px}
/* 右侧抽屉（后台） */
.mask.right{justify-content:flex-end;align-items:stretch;padding:0}
.drawer{width:560px;max-width:96vw;height:100%;overflow-y:auto;background:rgba(249,250,246,.92);backdrop-filter:blur(26px);border-left:1px solid var(--glass-hi);padding:24px 26px 40px;transform:translateX(36px);transition:.26s cubic-bezier(.2,.8,.3,1)}
.mask.in .drawer{transform:none}

/* ---------- Toast ---------- */
.toasts{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:130;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.mask-abs-toasts{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:88%}
.toast{background:rgba(44,62,40,.9);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;display:flex;gap:8px;align-items:center;animation:tin .28s cubic-bezier(.2,.8,.3,1);box-shadow:0 10px 30px rgba(44,62,40,.3);max-width:100%}
.toast .tdt{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.toast.ok .tdt{background:#8FBF7A}
.toast.warn .tdt{background:var(--accent)}
.toast.info .tdt{background:#A8B89B}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.94)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

/* ---------- 聊天气泡 ---------- */
.msgday{text-align:center;font-size:11px;color:var(--ink-2);margin:12px 0 8px}
.msgday span{background:rgba(122,139,116,.14);padding:2px 10px;border-radius:99px}
.mrow{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start}
.mrow.me{flex-direction:row-reverse}
.mbody{max-width:76%}
.who{font-size:10.5px;color:var(--ink-2);margin:0 2px 3px;display:flex;gap:8px;align-items:center}
.mrow.me .who{justify-content:flex-end}
.bub{padding:9px 13px;border-radius:15px;font-size:13.5px;line-height:1.6;word-break:break-word}
.bub.them{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.85);border-bottom-left-radius:5px;box-shadow:0 3px 10px rgba(62,92,58,.06)}
.bub.me{background:var(--primary);color:#fff;border-bottom-right-radius:5px;box-shadow:0 5px 14px rgba(62,92,58,.25)}
.bub.agent{background:rgba(107,142,90,.1);border:1px dashed rgba(107,142,90,.42);color:#3E5C3A;border-bottom-left-radius:5px}
.bub.sys{background:transparent;border:0;text-align:center;font-size:11.5px;color:var(--ink-2);padding:2px 10px}
.bub .atk{display:inline-flex;align-items:center;font-size:11px;color:var(--primary);font-weight:700}
.bub.me .atk{color:#DCE8D4}
.bub .priv{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--accent-dk);border:1px solid rgba(194,94,94,.35);padding:0 5px;border-radius:5px;margin-left:5px;vertical-align:1px}
.sysline{display:flex;align-items:center;gap:4px;justify-content:center}

/* AI 草稿气泡（律师端） */
.draft{border:1px solid rgba(194,94,94,.3);background:rgba(255,255,255,.66);border-radius:15px;padding:11px 13px;margin-bottom:10px;animation:fadeUp .32s;box-shadow:0 6px 18px rgba(194,94,94,.1)}
.draft .dctx{font-size:11px;color:var(--ink-2);margin-bottom:5px;display:flex;align-items:center;gap:8px}
.draft .dtx{font-size:13px;line-height:1.6;color:var(--ink);background:rgba(194,94,94,.07);border-radius:10px;padding:8px 11px}
.draft .dacts{display:flex;gap:8px;margin-top:9px;align-items:center}
.draft.editing .dtx{background:rgba(255,255,255,.9);border:1px solid rgba(194,94,94,.35)}
.aitag{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--accent-dk);border:1px solid rgba(194,94,94,.4);background:rgba(194,94,94,.08);border-radius:6px;padding:1px 6px;font-weight:600;white-space:nowrap}

/* 快捷回复条 */
.qr{padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(62,92,58,.18);font-size:11.5px;color:#4C5F47;cursor:pointer;white-space:nowrap;transition:.14s}
.qr:hover{border-color:var(--primary-2);color:var(--primary)}

/* 输入条 */
.composer{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;padding:10px 0 4px;background:linear-gradient(180deg,rgba(244,246,241,0),rgba(244,246,241,.97) 40%)}
.composer .cinput{flex:1;border:1px solid rgba(62,92,58,.2);background:rgba(255,255,255,.78);border-radius:14px;padding:9px 13px;font:inherit;font-size:13.5px;outline:0;max-height:96px}
.composer .cinput:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(107,142,90,.15)}

/* ---------- 时间段格子（律师时间表） ---------- */
.slot{border:1px solid rgba(62,92,58,.18);border-radius:10px;padding:6px 6px;font-size:11px;text-align:center;cursor:pointer;background:rgba(255,255,255,.42);transition:.14s;line-height:1.4;position:relative}
.slot:hover{border-color:var(--primary-2)}
.slot b{display:block;font-size:11.5px}
.slot.free{color:#4C5F47}
.slot.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(62,92,58,.3)}
.slot.busy{background:rgba(107,142,90,.16);border-color:transparent;color:#3E5C3A;cursor:not-allowed}
.slot.busy:hover{border-color:transparent}
.slot.lock{background:rgba(194,94,94,.09);border:1px dashed rgba(194,94,94,.45);color:var(--accent-dk);cursor:not-allowed}
.slot.past{opacity:.4;cursor:default;background:transparent}
.slot.past:hover{border-color:rgba(62,92,58,.18)}

/* ---------- 周历 ---------- */
.weekhd{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:6px}
.weekhd .wd{text-align:center;font-size:11px;color:var(--ink-2)}
.weekhd .wd b{display:block;font-size:13px;color:var(--ink)}
.weekhd .wd.today b{color:var(--accent-dk)}
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-content:start}

.steps{display:flex;gap:8px;margin:4px 0 18px}
.steps i{flex:1;height:4.5px;border-radius:99px;background:rgba(122,139,116,.22);transition:.3s}

.hero .h0 .rd{color:var(--accent)}
.hero .sub{color:var(--ink-2);margin-top:10px;font-size:14px}

.endcard:hover .go{gap:12px}

.tokrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.tok{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.55);border:1px solid var(--glass-hi);border-radius:11px;padding:6px 12px;font-size:11.5px;color:var(--ink-2)}
.tok i{width:16px;height:16px;border-radius:6px;flex-shrink:0;border:1px solid rgba(62,92,58,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.dirgrp{margin-top:14px}
.dirgrp .dgt{font-size:12px;color:var(--ink-2);letter-spacing:2px;margin:16px 4px 8px;font-weight:600}
.dir{display:flex;gap:8px;flex-wrap:wrap}
.dir button{border:1px solid rgba(62,92,58,.16);background:rgba(255,255,255,.5);border-radius:10px;padding:6px 13px;font-size:12.5px;color:#4C5F47;cursor:pointer;transition:.15s}
.dir button:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}

/* ---------- 后台布局 ---------- */
.admin{display:flex;gap:16px;align-items:flex-start}
.ad-side{width:220px;flex-shrink:0;position:sticky;top:76px;padding:14px 12px;border-radius:20px;max-height:calc(100vh - 96px);overflow-y:auto}
.ad-side .grp{font-size:10.5px;color:var(--ink-2);letter-spacing:2.5px;margin:14px 10px 5px;font-weight:600}
.ad-side .grp:first-child{margin-top:2px}
.ad-nav{display:flex;gap:12px;width:100%;text-align:left;padding:8.5px 12px;border:0;background:transparent;border-radius:11px;color:#5E6F58;cursor:pointer;font-size:13px;transition:.14s;align-items:center;position:relative}
.ad-nav:hover{background:rgba(62,92,58,.07);color:var(--primary)}
.ad-nav.on{background:rgba(62,92,58,.12);color:var(--primary);font-weight:600}
.ad-nav.on::before{content:'';position:absolute;left:-12px;top:20%;bottom:20%;width:3px;border-radius:99px;background:var(--accent)}
.ad-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.ad-main>.mt8,.ad-main>.mt12,.ad-main>.mt16{margin-top:0}
.ad-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--ink-2)}
.crumb b{color:var(--ink);font-weight:600}

/* ---------- 动画 ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.view-in{animation:fadeUp .3s cubic-bezier(.2,.8,.3,1)}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.pop{animation:popIn .3s cubic-bezier(.2,.8,.3,1)}
@media (max-width:980px){
  .ends{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .admin{flex-direction:column}
  .ad-side{width:100%;position:static;max-height:none}
  .grid4{grid-template-columns:repeat(2,1fr)}
}

/* ================= SVG 手绘图表 ================= */
const CH_G=['#3E5C3A','#6B8E5A','#A8B89B','#C9D6C0'],CH_R='#C25E5E';
function chartLine(data,opt={}){
  const w=opt.w||560,h=opt.h||180,pad=opt.pad||30,acc=!!opt.acc;
  const mn=Math.min(...data),mx=Math.max(...data),rg=(mx-mn)||1;
  const lo=mn-rg*.25,hi=mx+rg*.18;
  const xs=i=>pad+(w-2*pad)*i/(data.length-1), ys=v=>h-pad-(h-2*pad-14)*((v-lo)/(hi-lo));
  const pts=data.map((v,i)=>`${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(' ');
  const gid='gl'+(++_gid),c1=acc?CH_R:CH_G[1];
  const grid=[0,.5,1].map(t=>`<line x1="${pad}" x2="${w-pad}" y1="${(pad+(h-2*pad-14)*t).toFixed(1)}" y2="${(pad+(h-2*pad-14)*t).toFixed(1)}" stroke="rgba(62,92,58,.1)" stroke-dasharray="3 4"/>`).join('');
  const labels=(opt.labels||[]).map((t,i)=>`<text x="${xs(i).toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="#7A8B74">${t}</text>`).join('');
  const dots=data.map((v,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(v).toFixed(1)}" r="3.1" fill="#fff" stroke="${acc?CH_R:CH_G[0]}" stroke-width="1.7"/>`).join('');
  const last=data[data.length-1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" style="height:${h}px"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}" stop-opacity=".26"/><stop offset="1" stop-color="${c1}" stop-opacity="0"/></linearGradient></defs>${grid}
  <polygon points="${pad},${h-pad-12} ${pts} ${w-pad},${h-pad-12}" fill="url(#${gid})"/>
  <polyline points="${pts}" fill="none" stroke="${acc?CH_R:CH_G[0]}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>${dots}
  <text x="${xs(data.length-1)}" y="${ys(last)-10}" text-anchor="end" font-size="11.5" font-weight="700" fill="${acc?'#B14E4E':'#3E5C3A'}">${opt.fmt?opt.fmt(last):last}</text>${labels}</svg>`;
}
function chartBars(items,opt={}){
  const w=opt.w||560,h=opt.h||190,pad=34;
  const max=Math.max(...items.map(i=>i.v))*1.18||1,bw=(w-2*pad)/items.length;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" style="height:${h}px">
  ${items.map((it,i)=>{const bh=(h-2*pad-16)*it.v/max,x=pad+i*bw+bw*.18,y=h-pad-bh,c=it.acc?CH_R:CH_G[1];
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${Math.max(3,bh).toFixed(1)}" rx="7" fill="${c}" opacity="${it.acc?.92:.78}"/>
    <text x="${(x+bw*.32).toFixed(1)}" y="${(y-7).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="${it.acc?'#B14E4E':'#5E6F58'}">${it.fmt||it.v}</text>
    <text x="${(x+bw*.32).toFixed(1)}" y="${h-pad+15}" text-anchor="middle" font-size="11" fill="#7A8B74">${it.k}</text>`;}).join('')}
  <line x1="${pad-10}" x2="${w-pad+10}" y1="${h-pad}" y2="${h-pad}" stroke="rgba(62,92,58,.2)"/></svg>`;
}
function donut(segs,opt={}){
  const s=opt.s||150,r=s/2-13,C=2*Math.PI*r,total=segs.reduce((a,b)=>a+b.v,0);let off=0;
  const arcs=segs.map(sg=>{const fr=sg.v/total,el=`<circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="${sg.c}" stroke-width="13" stroke-dasharray="${(fr*C).toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-off*C).toFixed(1)}" transform="rotate(-90 ${s/2} ${s/2})"/>`;off+=fr;return el}).join('');
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" style="flex-shrink:0">${arcs}<text x="50%" y="47%" text-anchor="middle" font-size="16.5" font-weight="700" fill="#2C3E28">${opt.center||''}</text><text x="50%" y="61%" text-anchor="middle" font-size="10" fill="#7A8B74">${opt.sub||''}</text></svg>`;
}
function ring(pct,label,opt={}){
  const s=opt.s||62,r=s/2-6,C=2*Math.PI*r,c=opt.acc?CH_R:CH_G[0];
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" style="flex-shrink:0"><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="rgba(122,139,116,.2)" stroke-width="5"/><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(C*pct/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${s/2} ${s/2})"/><text x="50%" y="57%" text-anchor="middle" font-size="12" font-weight="700" fill="#2C3E28">${label}</text></svg>`;
}
function funnel(rows){
  const max=rows[0][1],cs=['#3E5C3A','#4E7247','#6B8E5A',CH_R];
  return `<div class="fcol" style="gap:8px">${rows.map((r,i)=>{const w=(r[1]/max*100).toFixed(1),rate=i?`<span class="tiny muted">转化 ${(r[1]/rows[i-1][1]*100).toFixed(1)}%</span>`:'';
    return `<div><div class="spread small" style="margin-bottom:3px"><span>${r[0]}</span><span class="row" style="gap:8px"><b>${r[1].toLocaleString()}</b>${rate}</span></div>
    <div style="height:14px;border-radius:99px;background:rgba(122,139,116,.14);overflow:hidden"><div style="width:${w}%;height:100%;border-radius:99px;background:${cs[i]};opacity:${i===3?.9:.85}"></div></div></div>`;}).join('')}</div>`;
}

function sendCode(btn){

function submitRealname(mask,flag){

    </div>
    <div class="spread mt12"><span class="small muted">应付现金</span><span class="money" style="font-size:21px" id="payAmt"><span class="rmb">¥</span>${per.toFixed(2)}</span></div>
    <button class="btn btn-p btn-lg mt8" id="payBtn" onclick="doPay('${sid}',${per})">确认支付 ${money(per.toFixed(2))}</button>

  </div></div>`);
  m.dataset.per=per;

function paySel(el){[...el.parentNode.children].forEach(c=>c.classList.remove('on'));el.classList.add('on');}
function payCalc(per){
  const sw=$('#ptSw'),max=Math.min(state.user.points,Math.floor(per*50));
  const on=sw.classList.contains('on');
  $('#ptRow').style.display=on?'':'none';
  $('#payAmt').innerHTML=`<span class="rmb">¥</span>${(on?per-max/100:per).toFixed(2)}`;
  $('#payAmt').dataset.v=(on?per-max/100:per).toFixed(2);
  $('#payBtn').innerHTML='确认支付 ¥'+(on?per-max/100:per).toFixed(2);
}
function doPay(sid,per){
  const btn=$('#payBtn');btn.disabled=true;btn.innerHTML='支付中…';
  setTimeout(()=>{
    const s=DB.sessions.find(x=>x.id===sid);
    const sw=$('#ptSw');const max=Math.min(state.user.points,Math.floor(per*50));
    const usePts=sw&&sw.classList.contains('on');
    if(usePts)state.user.points-=max;
    s.enrolled=Math.min(s.cap,s.enrolled+1);
    DB.myEnrolls.unshift({id:'E-'+(3005+DB.myEnrolls.length),sid,paid:per-(usePts?max/100:0),status:s.status==='open'?'open':'live',payAt:'10-13 14:22',pts:usePts?max:0});
    const full=s.enrolled>=s.cap;
    closeModal(btn.closest('.mask'));
    const done=overlay(`<div class="modal pop tc" style="max-width:340px">
      <div style="width:64px;height:64px;border-radius:50%;background:rgba(107,142,90,.15);display:inline-flex;align-items:center;justify-content:center;color:var(--primary)">${ic('check',30)}</div>

      <button class="btn btn-ghost mt8" style="width:100%" onclick="closeModal(this.closest('.mask'));render()">留在本页</button>
    </div>`);
  },900);
}

/* ---- 弹层 / Toast ---- */
function overlay(html,scope){
  const inPhone=scope!=='page'&&(state.end==='user'||state.end==='lawyer');
  const m=document.createElement('div');
  m.className='mask'+(inPhone?' abs':'');
  m.innerHTML=html;
  m.addEventListener('click',e=>{if(e.target===m)closeModal(m);});
  (inPhone?document.querySelector('.phone'):document.body).appendChild(m);
  requestAnimationFrame(()=>requestAnimationFrame(()=>m.classList.add('in')));
  return m;
}
function closeModal(m){if(!m)return;m.classList.remove('in');setTimeout(()=>m.remove(),240);}
function toast(msg,type='ok'){
  const inPhone=state.end==='user'||state.end==='lawyer';
  let wrap;
  if(inPhone){wrap=document.querySelector('.phone .mask-abs-toasts');
    if(!wrap){wrap=document.createElement('div');wrap.className='mask-abs-toasts';document.querySelector('.phone').appendChild(wrap);}}
  else wrap=$('#toasts');
  const t=document.createElement('div');t.className='toast '+type;t.innerHTML=`<span class="tdt"></span><span>${msg}</span>`;
  wrap.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320);},2800);
}

    <div class="small muted" style="line-height:1.85">${o.body}</div>
    <div class="m-foot"><button class="btn btn-o" onclick="closeModal(this.closest('.mask'))">取消</button>
    <button class="btn ${o.danger?'btn-p':'btn-g'}" id="cfOk">${o.okText||'确认'}</button></div></div>`);
  m.querySelector('#cfOk').addEventListener('click',()=>{closeModal(m);o.onOk&&o.onOk();});
  return m;
}
