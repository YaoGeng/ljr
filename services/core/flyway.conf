# M0-3 Flyway 配置（portable 轨与 docker 轨共用一份，ADR-0002）
#
# 连接信息不落盘：url/user/password 一律经环境变量 FLYWAY_URL / FLYWAY_USER / FLYWAY_PASSWORD 注入
#（docker 轨由 docker/dev/docker-compose.yml 注入；portable 轨由 scripts/db/*.mjs 从
# .secrets/dev.env 或进程 env 读取后注入），密钥禁入文件与源码（架构 §1.3）。
#
# 双轨一致口径：
#   1) locations=filesystem:migrations —— 相对 Flyway 进程 CWD 解析：
#      - docker 轨：容器 CWD=/flyway，compose 把 services/core/migrations 挂载到 /flyway/migrations；
#      - portable 轨：scripts/db/*.mjs 以 services/core 为 CWD 启动 flyway.cmd；
#      两轨因此共享同一相对路径，不需要在 conf 里写绝对路径或分叉配置。
#   2) schema 历史表放独立的 flyway schema（表名 schema_history，即 flyway.schema_history）：
#      - 与 13 个业务 schema（V1 创建）物理分离，业务 role 不授该 schema 任何权限；
#      - reset 演练时 flyway clean 只清 flyway schema（元数据），业务 schema 由 scripts/db/reset.mjs
#        显式 DROP 后整库重放——对齐 ADR-0002「down=drop 业务 schema 后整库重放」口径；
#      - 不放 public：public 留作 PG 默认区（PG15 起 public 默认无 CREATE），避免业务/工具元数据混杂。
#   3) flyway.schemas=flyway：声明 Flyway 自管的 schema，缺失时自动创建（createSchemas 默认 true）；
#      不把 13 个业务 schema 列入 flyway.schemas——它们由 V1 迁移显式创建，避免 Flyway 抢先建空 schema
#      导致 V1 语义（schema 归属/注释/权限一次性落账）被绕过。
#
# dev-only 开关（生产环境另配，保持 Flyway 默认 true 禁用 clean，ADR-0002）：
flyway.cleanDisabled=false

flyway.locations=filesystem:migrations
flyway.schemas=flyway
flyway.defaultSchema=flyway
flyway.table=schema_history
